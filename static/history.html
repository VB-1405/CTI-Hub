<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTI Hub — Scan History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#080c10;--surface:#0d1117;--panel:#111820;--border:#1e2d3d;--border2:#2a2a2a;
    --accent:#00d4ff;--accent2:#ff4757;--accent3:#2ed573;--warn:#ffa502;
    --text:#c9d1d9;--text-dim:#586069;--text-bright:#e6edf3;
    --glow:0 0 20px rgba(0,212,255,0.3);
    --mono:'Share Tech Mono',monospace;--ui:'Rajdhani',sans-serif;--head:'Orbitron',monospace;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased}
  body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.018) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}

  header{position:sticky;top:0;z-index:100;background:rgba(8,12,16,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:58px}
  .logo{font-family:var(--head);font-size:1.05rem;font-weight:900;color:var(--accent);letter-spacing:3px;text-shadow:var(--glow);display:flex;align-items:center;gap:10px;text-decoration:none}
  .logo-box{width:26px;height:26px;border:2px solid var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:var(--glow)}
  .nav-links{display:flex;gap:1rem;align-items:center}
  .nav-link{font-family:var(--mono);font-size:0.72rem;color:var(--text-dim);text-decoration:none;padding:4px 10px;border:1px solid transparent;transition:all 0.2s}
  .nav-link:hover,.nav-link.active{color:var(--accent);border-color:var(--border)}
  .header-btn{font-family:var(--head);font-size:0.65rem;font-weight:700;letter-spacing:1.5px;padding:5px 12px;border:1px solid var(--border);border-radius:3px;color:var(--text-dim);text-decoration:none;cursor:pointer;background:transparent;transition:all 0.2s}
  .header-btn:hover{border-color:var(--accent);color:var(--accent)}

  main{position:relative;z-index:1;max-width:1380px;margin:0 auto;padding:2rem}

  .page-header{margin-bottom:1.5rem}
  .page-title{font-family:var(--head);font-size:1.1rem;font-weight:900;color:var(--text-bright);letter-spacing:2px;margin-bottom:0.25rem}
  .page-sub{font-family:var(--mono);font-size:0.72rem;color:var(--text-dim)}

  /* Stats row */
  .stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-bottom:1.5rem}
  .stat-card{background:var(--panel);border:1px solid var(--border);padding:1rem 1.25rem}
  .stat-label{font-family:var(--mono);font-size:0.62rem;color:var(--text-dim);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.4rem}
  .stat-value{font-family:var(--head);font-size:1.4rem;font-weight:900;color:var(--text-bright)}
  .stat-value.red{color:var(--accent2)}
  .stat-value.warn{color:var(--warn)}
  .stat-value.grn{color:var(--accent3)}
  .stat-value.blue{color:var(--accent)}

  /* Controls */
  .controls{display:flex;gap:0.75rem;margin-bottom:1rem;align-items:center;flex-wrap:wrap}
  .search-input{background:var(--surface);border:1px solid var(--border);padding:0.6rem 1rem;color:var(--text-bright);font-family:var(--mono);font-size:0.82rem;outline:none;transition:border-color 0.2s;flex:1;min-width:220px}
  .search-input:focus{border-color:var(--accent)}
  .search-input::placeholder{color:var(--text-dim)}
  .filter-btn{background:transparent;border:1px solid var(--border);padding:0.55rem 1rem;color:var(--text-dim);font-family:var(--mono);font-size:0.72rem;cursor:pointer;transition:all 0.2s}
  .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
  .filter-btn.MALICIOUS.active{border-color:var(--accent2);color:var(--accent2)}
  .filter-btn.SUSPICIOUS.active{border-color:var(--warn);color:var(--warn)}
  .filter-btn.CLEAN.active{border-color:var(--accent3);color:var(--accent3)}

  /* Table */
  .history-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:0.78rem}
  .history-table th{color:var(--text-dim);font-weight:500;letter-spacing:0.08em;padding:0.6rem 0.75rem;text-align:left;border-bottom:1px solid var(--border);font-size:0.65rem;text-transform:uppercase}
  .history-table td{padding:0.75rem;border-bottom:1px solid rgba(30,45,61,0.5);vertical-align:middle}
  .history-table tr:hover td{background:rgba(0,212,255,0.03);cursor:pointer}
  .target-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-bright)}
  .verdict-pill{display:inline-block;padding:2px 9px;border:1px solid;border-radius:3px;font-size:0.65rem;letter-spacing:1px;font-weight:700}
  .v-MALICIOUS{color:var(--accent2);border-color:var(--accent2);background:rgba(255,71,87,0.08)}
  .v-SUSPICIOUS{color:var(--warn);border-color:var(--warn);background:rgba(255,165,2,0.08)}
  .v-CLEAN{color:var(--accent3);border-color:var(--accent3);background:rgba(46,213,115,0.07)}
  .v-UNKNOWN{color:var(--text-dim);border-color:var(--border)}
  .type-tag{background:var(--border);padding:1px 7px;font-size:0.62rem;color:var(--text-dim);border-radius:2px}
  .score-bar{width:60px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
  .score-fill{height:100%;border-radius:3px}

  .table-wrap{background:var(--panel);border:1px solid var(--border)}
  .table-footer{padding:0.75rem 1rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:0.7rem;color:var(--text-dim)}
  .pagination{display:flex;gap:4px}
  .page-btn{background:transparent;border:1px solid var(--border);padding:3px 10px;color:var(--text-dim);font-family:var(--mono);font-size:0.68rem;cursor:pointer;transition:all 0.2s}
  .page-btn:hover,.page-btn.active{border-color:var(--accent);color:var(--accent)}
  .page-btn:disabled{opacity:0.3;cursor:not-allowed}

  /* Detail modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:2rem;overflow-y:auto}
  .modal-overlay.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);width:100%;max-width:720px;margin:auto}
  .modal-header{padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-title{font-family:var(--head);font-size:0.78rem;font-weight:700;letter-spacing:2px;color:var(--text-bright)}
  .modal-close{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:1.2rem;padding:0 4px;transition:color 0.2s}
  .modal-close:hover{color:var(--text)}
  .modal-body{padding:1.5rem}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.25rem}
  .detail-field{background:var(--bg);border:1px solid var(--border);padding:0.65rem 0.85rem}
  .detail-label{font-family:var(--mono);font-size:0.6rem;color:var(--text-dim);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.25rem}
  .detail-value{font-family:var(--mono);font-size:0.82rem;color:var(--text-bright);word-break:break-all}
  .engine-results{margin-bottom:1.25rem}
  .engine-row{display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid rgba(30,45,61,0.5);font-family:var(--mono);font-size:0.75rem}
  .engine-row:last-child{border-bottom:none}
  .techniques-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:0.5rem}
  .t-chip{padding:2px 8px;border:1px solid var(--border);font-family:var(--mono);font-size:0.65rem;color:var(--text-dim)}
  .t-chip.high{border-color:var(--accent2);color:var(--accent2)}
  .t-chip.med{border-color:var(--warn);color:var(--warn)}
  .notes-area{width:100%;background:var(--bg);border:1px solid var(--border);padding:0.75rem;color:var(--text-bright);font-family:var(--mono);font-size:0.78rem;resize:vertical;min-height:80px;outline:none;transition:border-color 0.2s;margin-top:0.5rem}
  .notes-area:focus{border-color:var(--accent)}
  .btn{padding:0.5rem 1rem;border:none;cursor:pointer;font-family:var(--mono);font-size:0.72rem;letter-spacing:0.08em;transition:all 0.2s}
  .btn-primary{background:var(--accent);color:#000}
  .btn-primary:hover{background:#0099bb}
  .btn-danger{background:transparent;border:1px solid rgba(255,71,87,0.4);color:var(--accent2)}
  .btn-danger:hover{background:rgba(255,71,87,0.1)}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim)}
  .btn-ghost:hover{border-color:var(--text-mid);color:var(--text)}

  #toast{position:fixed;bottom:2rem;right:2rem;background:var(--panel);border:1px solid var(--accent);border-radius:6px;padding:10px 18px;font-family:var(--mono);font-size:0.78rem;color:var(--accent);box-shadow:var(--glow);z-index:9998;opacity:0;transform:translateY(8px);transition:all 0.25s;pointer-events:none}
  #toast.show{opacity:1;transform:translateY(0)}

  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent)}

  @media(max-width:768px){.stats-row{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <a class="logo" href="/">
    <div class="logo-box">⬡</div>CTI·HUB
  </a>
  <div class="nav-links">
    <a class="nav-link" href="/">Scanner</a>
    <a class="nav-link active" href="/history">History</a>
    <a class="nav-link" id="adminNavLink" href="/admin" style="display:none">Admin</a>
  </div>
  <button class="header-btn" onclick="logout()">SIGN OUT</button>
</header>

<main>
  <div class="page-header">
    <div class="page-title">SCAN HISTORY</div>
    <div class="page-sub" id="pageSubtitle">Loading...</div>
  </div>

  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-label">Total Scans</div><div class="stat-value blue" id="statTotal">—</div></div>
    <div class="stat-card"><div class="stat-label">Malicious</div><div class="stat-value red" id="statMalicious">—</div></div>
    <div class="stat-card"><div class="stat-label">Suspicious</div><div class="stat-value warn" id="statSuspicious">—</div></div>
    <div class="stat-card"><div class="stat-label">Clean</div><div class="stat-value grn" id="statClean">—</div></div>
    <div class="stat-card"><div class="stat-label">Avg Threat Score</div><div class="stat-value" id="statAvg">—</div></div>
  </div>

  <div class="controls">
    <input class="search-input" id="searchInput" placeholder="Search by target, IP, hash, URL..." oninput="debounceSearch()">
    <button class="filter-btn" id="filter-ALL" onclick="setFilter('ALL')">All</button>
    <button class="filter-btn MALICIOUS" id="filter-MALICIOUS" onclick="setFilter('MALICIOUS')">Malicious</button>
    <button class="filter-btn SUSPICIOUS" id="filter-SUSPICIOUS" onclick="setFilter('SUSPICIOUS')">Suspicious</button>
    <button class="filter-btn CLEAN" id="filter-CLEAN" onclick="setFilter('CLEAN')">Clean</button>
  </div>

  <div class="table-wrap">
    <table class="history-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Timestamp</th>
          <th>Target</th>
          <th>Type</th>
          <th>Verdict</th>
          <th>Score</th>
          <th>Engines</th>
          <th>Analyst</th>
        </tr>
      </thead>
      <tbody id="historyTableBody">
        <tr><td colspan="8" style="padding:2rem;text-align:center;color:var(--text-dim)">Loading...</td></tr>
      </tbody>
    </table>
    <div class="table-footer">
      <span id="tableInfo">—</span>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">SCAN DETAIL</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const TOKEN = localStorage.getItem('cti_token');
if (!TOKEN) window.location.href = '/login';
const HEADERS = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };

let currentPage  = 0;
let currentFilter= 'ALL';
let searchQuery  = '';
let searchTimer  = null;
const PAGE_SIZE  = 50;

// Auth
fetch('/api/auth/me', { headers: HEADERS })
  .then(r => { if (!r.ok) { localStorage.clear(); window.location.href='/login'; } return r.json(); })
  .then(u => {
    if (u.role === 'admin') document.getElementById('adminNavLink').style.display = 'inline';
  });

function logout() { localStorage.clear(); window.location.href = '/login'; }

// Stats
async function loadStats() {
  const r    = await fetch('/api/history/stats', { headers: HEADERS });
  const data = await r.json();
  document.getElementById('statTotal').textContent     = data.total;
  document.getElementById('statMalicious').textContent = data.malicious;
  document.getElementById('statSuspicious').textContent= data.suspicious;
  document.getElementById('statClean').textContent     = data.clean;
  document.getElementById('statAvg').textContent       = `${Math.round(data.avg_score*100)}%`;
  document.getElementById('pageSubtitle').textContent  = `${data.total} total scans · ${data.malicious} malicious detections`;
}

// History
async function loadHistory() {
  const q   = searchQuery ? `&q=${encodeURIComponent(searchQuery)}` : '';
  const r   = await fetch(`/api/history?limit=${PAGE_SIZE}&offset=${currentPage*PAGE_SIZE}${q}`, { headers: HEADERS });
  const data= await r.json();

  let scans = data.scans;
  if (currentFilter !== 'ALL') scans = scans.filter(s => s.verdict === currentFilter);

  const tbody = document.getElementById('historyTableBody');
  if (!scans.length) {
    tbody.innerHTML = `<tr><td colspan="8" style="padding:2rem;text-align:center;color:var(--text-dim);font-family:var(--mono);font-size:0.75rem">No scans found</td></tr>`;
    return;
  }

  tbody.innerHTML = scans.map(s => {
    const score    = Math.round((s.threat_score||0)*100);
    const color    = score>=60?'var(--accent2)':score>=25?'var(--warn)':'var(--accent3)';
    const ts       = new Date(s.timestamp).toLocaleString('en-US',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
    return `<tr onclick="showDetail(${s.id})">
      <td style="color:var(--text-dim)">${s.id}</td>
      <td style="font-family:var(--mono);font-size:0.72rem;color:var(--text-dim);white-space:nowrap">${ts}</td>
      <td><div class="target-cell" title="${s.target}">${s.target}</div></td>
      <td><span class="type-tag">${s.target_type||'?'}</span></td>
      <td><span class="verdict-pill v-${s.verdict}">${s.verdict}</span></td>
      <td>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="score-bar"><div class="score-fill" style="width:${score}%;background:${color}"></div></div>
          <span style="font-family:var(--mono);font-size:0.72rem;color:${color}">${score}%</span>
        </div>
      </td>
      <td style="font-family:var(--mono);font-size:0.72rem;color:var(--text-dim)">${s.engines_hit}/${s.engines_total}</td>
      <td style="font-family:var(--mono);font-size:0.72rem;color:var(--text-dim)">${s.analyst||'—'}</td>
    </tr>`;
  }).join('');

  // Pagination
  const totalPages = Math.ceil(data.total/PAGE_SIZE);
  document.getElementById('tableInfo').textContent = `Showing ${scans.length} of ${data.total} scans`;
  const pg = document.getElementById('pagination');
  pg.innerHTML = `
    <button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>←</button>
    <button class="page-btn active">${currentPage+1} / ${totalPages}</button>
    <button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>→</button>`;
}

function goPage(p) { currentPage = p; loadHistory(); }

function setFilter(f) {
  currentFilter = f; currentPage = 0;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`filter-${f}`).classList.add('active');
  loadHistory();
}

function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchQuery = document.getElementById('searchInput').value.trim(); currentPage=0; loadHistory(); }, 300);
}

// Detail modal
async function showDetail(id) {
  const r    = await fetch(`/api/history/${id}`, { headers: HEADERS });
  const scan = await r.json();

  const score    = Math.round((scan.threat_score||0)*100);
  const color    = score>=60?'var(--accent2)':score>=25?'var(--warn)':'var(--accent3)';
  const ts       = new Date(scan.timestamp).toLocaleString();
  const results  = typeof scan.results==='string' ? JSON.parse(scan.results) : scan.results;
  const techs    = typeof scan.techniques==='string' ? JSON.parse(scan.techniques) : scan.techniques;

  const engineRows = Object.entries(results).map(([k,v]) => {
    const c = v==='MALICIOUS'?'var(--accent2)':v==='SUSPICIOUS'?'var(--warn)':v==='CLEAN'?'var(--accent3)':'var(--text-dim)';
    return `<div class="engine-row"><span>${k}</span><span style="color:${c}">${v}</span></div>`;
  }).join('');

  const techChips = (techs||[]).map(t =>
    `<span class="t-chip ${t.severity||'low'}">${t.name}</span>`
  ).join('');

  document.getElementById('modalTitle').textContent = `SCAN #${scan.id} — ${scan.verdict}`;
  document.getElementById('modalBody').innerHTML = `
    <div class="detail-grid">
      <div class="detail-field" style="grid-column:1/-1">
        <div class="detail-label">Target</div>
        <div class="detail-value">${scan.target}</div>
      </div>
      <div class="detail-field">
        <div class="detail-label">Verdict</div>
        <div class="detail-value"><span class="verdict-pill v-${scan.verdict}">${scan.verdict}</span></div>
      </div>
      <div class="detail-field">
        <div class="detail-label">Threat Score</div>
        <div class="detail-value" style="color:${color}">${score}%</div>
      </div>
      <div class="detail-field">
        <div class="detail-label">Type</div>
        <div class="detail-value">${scan.target_type}</div>
      </div>
      <div class="detail-field">
        <div class="detail-label">Engines</div>
        <div class="detail-value">${scan.engines_hit}/${scan.engines_total} responded</div>
      </div>
      <div class="detail-field">
        <div class="detail-label">Analyst</div>
        <div class="detail-value">${scan.analyst||'—'}</div>
      </div>
      <div class="detail-field">
        <div class="detail-label">Timestamp</div>
        <div class="detail-value">${ts}</div>
      </div>
    </div>

    ${engineRows ? `<div style="margin-bottom:1.25rem">
      <div style="font-family:var(--mono);font-size:0.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.5rem">Engine Results</div>
      <div style="background:var(--bg);border:1px solid var(--border);padding:0 0.75rem">${engineRows}</div>
    </div>` : ''}

    ${techChips ? `<div style="margin-bottom:1.25rem">
      <div style="font-family:var(--mono);font-size:0.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.5rem">CAPA Techniques</div>
      <div class="techniques-list">${techChips}</div>
    </div>` : ''}

    <div>
      <div style="font-family:var(--mono);font-size:0.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em">Analyst Notes</div>
      <textarea class="notes-area" id="notesArea" placeholder="Add investigation notes...">${scan.notes||''}</textarea>
      <div style="display:flex;gap:0.5rem;margin-top:0.75rem;justify-content:space-between">
        <button class="btn btn-danger" onclick="deleteScan(${scan.id})">Delete</button>
        <div style="display:flex;gap:0.5rem">
          <button class="btn btn-ghost" onclick="closeModal()">Close</button>
          <button class="btn btn-primary" onclick="saveNotes(${scan.id})">Save Notes</button>
        </div>
      </div>
    </div>`;

  document.getElementById('detailModal').classList.add('show');
}

async function saveNotes(id) {
  const notes = document.getElementById('notesArea').value;
  await fetch(`/api/history/${id}/notes`, { method:'PUT', headers:HEADERS, body:JSON.stringify({notes}) });
  toast('Notes saved');
}

async function deleteScan(id) {
  if (!confirm('Delete this scan record?')) return;
  await fetch(`/api/history/${id}`, { method:'DELETE', headers:HEADERS });
  closeModal(); toast('Scan deleted'); loadHistory(); loadStats();
}

function closeModal() { document.getElementById('detailModal').classList.remove('show'); }
document.getElementById('detailModal').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

// Init
setFilter('ALL');
loadStats();
</script>
</body>
</html>
